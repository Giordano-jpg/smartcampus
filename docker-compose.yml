services:
  backend:
    build: .
    container_name: smartcampus-backend
    env_file: .env
    ports:
      - "${APP_PORT:-8000}:8000"
    networks:
      - smartcampus-net
    volumes:
      - smartcampus-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

networks:
  smartcampus-net:

volumes:
  smartcampus-data:
