name: CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  APP_ENV: ci

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calidad de codigo (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Tests (pytest)
        run: pytest

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Construir imagen
        run: docker build -t smartcampus .

      - name: Arrancar contenedor y comprobar /health
        run: |
          docker run -d --name smartcampus -p 8000:8000 smartcampus
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker logs smartcampus
          exit 1

  # Solo al actualizar main: publica la imagen y despliega en el runner local.
  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartcampus:latest
            ${{ secrets.DOCKER_USERNAME }}/smartcampus:${{ github.sha }}

  deploy:
    runs-on: self-hosted
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Crear .env de produccion
        run: printf 'APP_ENV=production\nAPP_PORT=8000\nDB_PATH=/data/smartcampus.db\n' > .env

      - name: Desplegar con docker compose
        run: docker compose up -d --build

      - name: Comprobar /health
        run: |
          for i in $(seq 1 15); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 2
          done
          docker compose logs backend
          exit 1
